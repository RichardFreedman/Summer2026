# Grainger -> EMu demo. No ports published; the shared Caddy in deploy/caddy
# reaches it as "grainger:8501" over the external "web" network.
services:
  grainger:
    build: ../../Grainger-Mapping-Demo
    restart: unless-stopped
    env_file: .env
    expose:
      - "8501"
    networks:
      - web

networks:
  web:
    external: true
