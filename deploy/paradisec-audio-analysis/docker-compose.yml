# PARADISEC audio analysis app. No ports published; the shared Caddy in
# deploy/caddy reaches it as "paradisec-audio-analysis:8501" over the external
# "web" network. No .env: the app has no keys, and the login is Caddy's.
services:
  paradisec-audio-analysis:
    build: ../../PARADISEC/audio-analysis
    restart: unless-stopped
    expose:
      - "8501"
    networks:
      - web

networks:
  web:
    external: true
